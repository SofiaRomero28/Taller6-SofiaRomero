<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabecera principal -->
    <header class="main-header">
        <div class="header-container">
            <p class="brand-sub">SHOP API</p>
            <h1 class="brand-title">Catálogo de productos</h1>
            <p class="brand-desc">Selecciona un producto para consultar su información.</p>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="catalog-container">
        <div class="catalog-header">
            <h2>Productos disponibles</h2>
            <input type="text" id="search-input" placeholder="Buscar producto...">
        </div>

        <!-- Contenedor dinámico de productos -->
        <div id="products-grid" class="products-grid">
            <!-- Las tarjetas se cargarán aquí con JS -->
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
