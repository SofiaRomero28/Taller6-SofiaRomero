<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabecera de Detalle -->
    <header class="main-header">
        <div class="header-container">
            <p class="brand-sub">SHOP API</p>
            <h1 class="brand-title">Detalle del producto</h1>
        </div>
    </header>

    <!-- Contenedor del Detalle -->
    <main class="detail-container">
        <!-- Enlace de regreso al catálogo -->
        <a href="index.html" class="back-link">&larr; Volver al catálogo</a>

        <!-- Tarjeta expandida del Producto -->
        <div id="product-detail-card" class="product-detail-card">
            <!-- Los datos detallados se cargarán dinámicamente aquí -->
            <p class="loading-text">Cargando información del producto...</p>
        </div>
    </main>

    <script src="detail.js"></script>
</body>
</html>
